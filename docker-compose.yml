version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gasha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gasha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gasha_password}
      POSTGRES_DB: ${POSTGRES_DB:-gasha_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gasha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
