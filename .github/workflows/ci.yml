name: GASHA Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-contracts:
    name: Validate Contracts & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @gasha/contracts run typecheck

  python-backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Ruff (errors only)
        run: ruff check apps/api/app --select E9,F63,F7,F82
      - name: Backend unit tests
        working-directory: apps/api
        env:
          PYTHONPATH: .:../../packages/telemetry-sdk/python
        run: python -m pytest tests -q --deselect tests/unit/test_rule_contract_parity.py::test_typescript_contract_file_parity
      - name: Telemetry SDK tests
        env:
          PYTHONPATH: packages/telemetry-sdk/python
        run: python -m pytest packages/telemetry-sdk/python/tests -q