name: GASHA Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-contracts:
    name: Validate Contracts & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gasha/contracts run typecheck

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      # Lint is reported but does not block yet (the frontend has ~10 'no-explicit-any' errors to clean up).
      - name: Lint (non-blocking for now)
        run: pnpm --filter @gasha/web lint
        continue-on-error: true
      - name: Build
        run: pnpm --filter @gasha/web build

  python-backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Ruff (errors only)
        run: ruff check apps/api/app --select E9,F63,F7,F82
      - name: Backend unit tests
        working-directory: apps/api
        env:
          PYTHONPATH: .:../../packages/telemetry-sdk/python
        run: python -m pytest tests -q
      - name: Telemetry SDK tests
        env:
          PYTHONPATH: packages/telemetry-sdk/python
        run: python -m pytest packages/telemetry-sdk/python/tests -q